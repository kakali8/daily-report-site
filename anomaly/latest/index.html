<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异常检测仪表板 v3.4 | Anomaly Detection Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #151b2d;
            --bg-card: #1a2237;
            --bg-card-hover: #202945;
            --bg-tab: #141a2b;
            --bg-tab-active: #243050;

            --text-primary: #e8edf4;
            --text-secondary: #8b95ab;
            --text-muted: #5a6684;

            --accent-critical: #ff4757;
            --accent-warning: #ffa502;
            --accent-info: #3742fa;
            --accent-success: #2ed573;
            --accent-purple: #a55eea;

            --border-color: #2a3551;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(42, 53, 81, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(42, 53, 81, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            margin-bottom: 60px;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            letter-spacing: -0.03em;
            animation: fadeInDown 0.8s ease-out;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 300;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
            animation: fadeIn 1s ease-out 0.4s both;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            transition: width 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border-color: var(--accent-info);
        }

        .stat-card:hover::before {
            width: 100%;
            opacity: 0.1;
        }

        .stat-card.critical::before { background: var(--accent-critical); }
        .stat-card.warning::before { background: var(--accent-warning); }
        .stat-card.trend::before { background: var(--accent-purple); }
        .stat-card.info::before { background: var(--accent-info); }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1;
        }

        .stat-card.critical .stat-value { color: var(--accent-critical); }
        .stat-card.warning .stat-value { color: var(--accent-warning); }
        .stat-card.trend .stat-value { color: var(--accent-purple); }
        .stat-card.sudden .stat-value { color: var(--accent-info); }

        .anomaly-section {
            margin-bottom: 60px;
            animation: slideInUp 0.6s ease-out;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }

        .section-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .section-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .section-count {
            margin-left: auto;
            background: var(--bg-secondary);
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .critical-error .section-icon {
            background: linear-gradient(135deg, var(--accent-critical) 0%, #d63031 100%);
        }
        .critical-error .section-count {
            color: var(--accent-critical);
            border: 1px solid var(--accent-critical);
        }

        .status-anomaly .section-icon {
            background: linear-gradient(135deg, var(--accent-warning) 0%, #fd9644 100%);
        }
        .status-anomaly .section-count {
            color: var(--accent-warning);
            border: 1px solid var(--accent-warning);
        }

        .sudden-change .section-icon {
            background: linear-gradient(135deg, #3742fa 0%, #5f27cd 100%);
        }
        .sudden-change .section-count {
            color: var(--accent-info);
            border: 1px solid var(--accent-info);
        }

        .trend-deterioration .section-icon {
            background: linear-gradient(135deg, var(--accent-purple) 0%, #8e44ad 100%);
        }
        .trend-deterioration .section-count {
            color: var(--accent-purple);
            border: 1px solid var(--accent-purple);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(600px, 1fr));
            gap: 24px;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            border-color: var(--accent-info);
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .metric-title {
            flex: 1;
        }

        .metric-name {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .metric-id {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .metric-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge.critical {
            background: rgba(255, 71, 87, 0.15);
            color: var(--accent-critical);
            border: 1px solid var(--accent-critical);
        }

        .badge.warning {
            background: rgba(255, 165, 2, 0.15);
            color: var(--accent-warning);
            border: 1px solid var(--accent-warning);
        }

        .badge.info {
            background: rgba(55, 66, 250, 0.15);
            color: var(--accent-info);
            border: 1px solid var(--accent-info);
        }

        .badge.trend {
            background: rgba(165, 94, 234, 0.15);
            color: var(--accent-purple);
            border: 1px solid var(--accent-purple);
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            padding: 10px 20px;
            background: var(--bg-tab);
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .tab:hover {
            background: var(--bg-tab-active);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--bg-tab-active);
            color: var(--accent-info);
            border-color: var(--accent-info);
        }

        .dimension-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .dimension-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 1;
            min-width: 200px;
        }

        .dimension-controls label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
            white-space: nowrap;
        }

        .dimension-controls select {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.875rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dimension-controls select:hover {
            border-color: var(--accent-info);
        }

        .dimension-controls select:focus {
            outline: none;
            border-color: var(--accent-info);
            box-shadow: 0 0 0 2px rgba(55, 66, 250, 0.2);
        }

        .chart-container {
            position: relative;
            height: 280px;
            margin-bottom: 16px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .anomaly-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }

        .detail-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .detail-value {
            font-size: 1rem;
            color: var(--text-primary);
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .detail-value.critical { color: var(--accent-critical); }
        .detail-value.warning { color: var(--accent-warning); }
        .detail-value.info { color: var(--accent-info); }
        .detail-value.success { color: var(--accent-success); }

        .anomaly-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .anomaly-tag {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .anomaly-tag.has-critical {
            background: rgba(255, 71, 87, 0.2);
            color: var(--accent-critical);
        }

        .anomaly-tag.has-status {
            background: rgba(255, 165, 2, 0.2);
            color: var(--accent-warning);
        }

        .anomaly-tag.has-sudden {
            background: rgba(55, 66, 250, 0.2);
            color: var(--accent-info);
        }

        .anomaly-tag.has-trend {
            background: rgba(165, 94, 234, 0.2);
            color: var(--accent-purple);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-state-text {
            font-size: 1.125rem;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .metrics-grid {
                grid-template-columns: 1fr;
            }
            .anomaly-details {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

                `;

                tabContentsHtml += `
                    <div class="tab-content active" id="${cardId}_tab_overall">
                        <div class="chart-container">
                            <canvas id="${cardId}_chart_overall"></canvas>
                        </div>
                    </div>
                `;

                tabContentsHtml += `
                    <div class="tab-content" id="${cardId}_tab_dimensions">
                        ${renderDimensionControls(cardId, datasets)}
                        <div class="chart-container">
                            <canvas id="${cardId}_chart_dimension"></canvas>
                        </div>
                    </div>
                `;
            } else {
                tabContentsHtml = `
                    <div class="chart-container">
                        <canvas id="${cardId}_chart_overall"></canvas>
                    </div>
                `;
            }

            const stats = calculateMetricStats(metric.overall_data, anomalyType);

            return `
                <div class="metric-card" id="${cardId}" data-metric-id="${metric.metric_id}">
                    <div class="metric-header">
                        <div class="metric-title">
                            <div class="metric-name">${metric.metric_name}</div>
                            <div class="metric-id">${metric.metric_id}</div>
                        </div>
                        <div class="metric-badges">${badges}</div>
                    </div>

                    ${tabsHtml}
                    ${tabContentsHtml}

                    <div class="anomaly-details" id="${cardId}_details">
                        ${renderDetails(stats, metric.overall_data[metric.overall_data.length - 1] || {}, anomalyType)}
                    </div>
                </div>
            `;
        }

        function renderDimensionControls(cardId, datasets) {
            const availableDatasets = Object.keys(datasets).filter(k => k !== 'overall');

            if (availableDatasets.length === 0) return '';

            const datasetSelectId = `${cardId}_select_dataset`;

            let controlsHtml = '<div class="dimension-controls">';

            controlsHtml += `
                <div class="dimension-group">
                    <label for="${datasetSelectId}">维度类型:</label>
                    <select id="${datasetSelectId}" onchange="onDatasetChange('${cardId}')">
                        ${availableDatasets.map((ds, idx) => 
                            `<option value="${ds}" ${idx === 0 ? 'selected' : ''}>${formatDatasetName(ds)}</option>`
                        ).join('')}
                    </select>
                </div>
            `;

            controlsHtml += `<div id="${cardId}_dim_values_container" style="display: contents;"></div>`;
            controlsHtml += '</div>';
            return controlsHtml;
        }
        
        
        function formatDatasetName(datasetName) {
            if (datasetName === 'overall') return 'Overall';

            const name = datasetName.replace(/^by_/, '');
            const parts = name.split('_').map(p => 
                p.charAt(0).toUpperCase() + p.slice(1)
            );

            return parts.join(' + ');
        }

        function onDatasetChange(cardId) {
            updateDimensionValueSelectors(cardId);
            updateDimensionChart(cardId, false);

        }

        function updateDimensionValueSelectors(cardId) {
            const metric = metricDataMap[cardId];
            if (!metric) return;

            const datasets = metric.datasets || {};
            const datasetSelectEl = document.getElementById(`${cardId}_select_dataset`);
            const selectedDataset = datasetSelectEl ? datasetSelectEl.value : null;

            if (!selectedDataset || !datasets[selectedDataset]) return;

            const dataset = datasets[selectedDataset];
            const dimensions = dataset.dimensions || [];
            const dimValues = dataset.dim_values || {};
            const allData = dataset.data || [];
            const anomalyType = metric.anomaly_type;

            const container = document.getElementById(`${cardId}_dim_values_container`);
            if (!container) return;

            let html = '';
            dimensions.forEach(dim => {
                const values = dimValues[dim] || [];
                if (values.length === 0) return;

                const selectId = `${cardId}_select_dimval_${dim}`;

                html += `
                    <div class="dimension-group">
                        <label for="${selectId}">${formatDimensionName(dim)}:</label>
                        <select id="${selectId}" onchange="updateDimensionChart('${cardId}')">
                            ${values.map((val, idx) => {
                                // 计算该维度值的异常标签（按分类）
                                const anomalyLabels = getDimValueAnomalyLabels(allData, dimensions, dim, val, anomalyType);
                                const labelStr = anomalyLabels.length > 0 ? ' ' + anomalyLabels.join(' ') : '';
                                return `<option value="${val}" ${idx === 0 ? 'selected' : ''}>${val}${labelStr}</option>`;
                            }).join('')}
                        </select>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function getDimValueAnomalyLabels(allData, dimensions, targetDim, targetValue, anomalyType) {
            // 过滤出该维度值的所有数据
            const filteredData = allData.filter(record => 
                String(record[targetDim]) === String(targetValue)
            );

            const labels = [];

            // 根据当前卡片的异常类型判断
            switch (anomalyType) {
                case 'critical':
                    if (filteredData.some(d => d.if_error === 1 && d.status_anomaly_flag === 1)) {
                        labels.push('🔴');
                    }
                    break;
                case 'status':
                    if (filteredData.some(d => d.status_anomaly_flag === 1)) {
                        labels.push('⚠️');
                    }
                    break;
                case 'sudden':
                    if (filteredData.some(d => d.sudden_flag === 1 )) {
                        labels.push('⚡');
                    }
                    break;
                case 'trend':
                    if (filteredData.some(d => (d.bad_ratio || 0) >= 0.3 && d.overall_trend_negative === 1)) {
                        labels.push('📉');
                    }
                    break;
            }

            return labels;
        }

        function formatDimensionName(dim) {
            return dim.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        function initializeMetricCard(cardId, metric, anomalyType) {
            const datasets = metric.datasets || {};

            if (datasets.overall) {
                renderChart(`${cardId}_chart_overall`, datasets.overall.data, anomalyType);
            }

            const hasDimensions = Object.keys(datasets).some(k => k !== 'overall');
            if (hasDimensions) {
                updateDimensionValueSelectors(cardId);
                updateDimensionChart(cardId, false);
                updateOverallDetails(cardId); 
            }
        }

        function switchTab(cardId, tabName) {
          const card = document.getElementById(cardId);
          if (!card) return;
        
          const tabs = card.querySelectorAll('.tab');
          const contents = card.querySelectorAll('.tab-content');
        
          // 1) 先切换 tab 样式
          tabs.forEach(tab => {
            tab.classList.toggle('active', tab.dataset.tab === tabName);
          });
        
          contents.forEach(content => {
            content.classList.toggle('active', content.id === `${cardId}_tab_${tabName}`);
          });
        
          // 2) 再根据 tab 更新图/底部详情
          if (tabName === 'overall') {
            // overall：刷新 bottom details 为 overall 最新值
            updateOverallDetails(cardId);
          } else if (tabName === 'dimensions') {
            // dimensions：刷新维度图 + 维度 bottom details
            updateDimensionChart(cardId, true);
          }
        }

        
        function updateOverallDetails(cardId) {
          const metric = metricDataMap[cardId];
          if (!metric) return;
        
          const anomalyType = metric.anomaly_type;
          const overallData = (metric.datasets && metric.datasets.overall && metric.datasets.overall.data)
            ? metric.datasets.overall.data
            : (metric.overall_data || []);
        
          const sorted = (overallData || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
        
          const stats = calculateMetricStats(sorted, anomalyType);
          const latestRecord = sorted[sorted.length - 1] || {};
        
          const detailsEl = document.getElementById(`${cardId}_details`);
          if (detailsEl) {
            detailsEl.innerHTML = renderDetails(stats, latestRecord, anomalyType, sorted);
          }
        }

        
        
        function updateDimensionChart(cardId, updateDetails = true) {
            const metric = metricDataMap[cardId];
            if (!metric) return;

            const datasets = metric.datasets || {};
            const anomalyType = metric.anomaly_type;

            const datasetSelectEl = document.getElementById(`${cardId}_select_dataset`);
            const selectedDataset = datasetSelectEl ? datasetSelectEl.value : null;

            if (!selectedDataset || !datasets[selectedDataset]) return;

            const dataset = datasets[selectedDataset];
            const dimensions = dataset.dimensions || [];
            const allData = dataset.data || [];

            const selectedDimValues = {};
            dimensions.forEach(dim => {
                const selectEl = document.getElementById(`${cardId}_select_dimval_${dim}`);
                if (selectEl) {
                    selectedDimValues[dim] = selectEl.value;
                }
            });

            let filteredData = allData.filter(record => {
                return Object.keys(selectedDimValues).every(dim => 
                    String(record[dim]) === String(selectedDimValues[dim])
                );
            });

            filteredData.sort((a, b) => new Date(a.date) - new Date(b.date));

            renderChart(`${cardId}_chart_dimension`, filteredData, anomalyType);

            if (updateDetails) {
                const stats = calculateMetricStats(filteredData, anomalyType);
                const latestRecord = filteredData[filteredData.length - 1] || {};
                const detailsEl = document.getElementById(`${cardId}_details`);
                if (detailsEl) {
                  detailsEl.innerHTML = renderDetails(stats, latestRecord, anomalyType, filteredData);
                }
            }
        }


        function getBadges(anomalyType) {
            const badgeMap = {
                'critical': '<span class="badge critical">Critical</span>',
                'status': '<span class="badge warning">Status</span>',
                'sudden': '<span class="badge info">Sudden</span>',
                'trend': '<span class="badge trend">Trend</span>'
            };
            return badgeMap[anomalyType] || '';
        }

        function calculateMetricStats(data, anomalyType) {
            const anomalyData = data.filter(d => isAnomaly(d, anomalyType));

            const anomalyCount = anomalyData.length;
            const avgAbsDelta = anomalyData.length > 0
                ? (anomalyData.reduce((sum, d) => sum + Math.abs(d.delta_pct || 0), 0) / anomalyData.length * 100).toFixed(1)
                : '0.0';

            return { anomalyCount, avgAbsDelta };
        }

        function getAnomalyTags(data) {
            const tags = [];

            const hasCritical = data.some(d => d.if_error === 1 && d.status_anomaly_flag === 1);
            const hasStatus = data.some(d => d.status_anomaly_flag === 1);
            const hasSudden = data.some(d => d.sudden_flag === 1 );
            const hasTrend = data.some(d => (d.bad_ratio || 0) >= 0.3 && d.overall_trend_negative === 1);

            if (hasCritical) tags.push('<span class="anomaly-tag has-critical">Critical</span>');
            if (hasStatus) tags.push('<span class="anomaly-tag has-status">Status</span>');
            if (hasSudden) tags.push('<span class="anomaly-tag has-sudden">Sudden</span>');
            if (hasTrend) tags.push('<span class="anomaly-tag has-trend">Trend</span>');

            return tags;
        }

        function renderDetails(stats, latestRecord, anomalyType, allData) {
            const value = latestRecord.value != null ? Number(latestRecord.value).toFixed(2) : 'N/A';
            const baseline = latestRecord.baseline_value != null ? Number(latestRecord.baseline_value).toFixed(2) : 'N/A';
            const threshold = latestRecord.threshold != null ? Number(latestRecord.threshold).toFixed(2) : 'N/A';
            const streakLen = latestRecord.streak_len != null ? latestRecord.streak_len : 0;

            // Δ% (VS BASELINE)
            const deltaPct = latestRecord.delta_pct != null ? (latestRecord.delta_pct * 100).toFixed(1) + '%' : 'N/A';

            // 异常平均 |Δ%|
            const avgAbsDelta = stats.avgAbsDelta;

            // 当前点是否异常
            const isCurrentAnomaly = isAnomaly(latestRecord, anomalyType);
            const currentAnomalyStatus = isCurrentAnomaly ? '是' : '否';
            const currentAnomalyClass = isCurrentAnomaly ? 'critical' : 'success';

            let anomalyTagsHtml = '';
            if (allData && allData.length > 0) {
                const tags = getAnomalyTags(allData);
                if (tags.length > 0) {
                    anomalyTagsHtml = '<div class="anomaly-tags">' + tags.join('') + '</div>';
                }
            }

            return `
                <div class="detail-item">
                    <div class="detail-label">异常点数</div>
                    <div class="detail-value warning">${stats.anomalyCount}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">最新值</div>
                    <div class="detail-value">${value}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Δ% (VS BASELINE)</div>
                    <div class="detail-value">${deltaPct}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">异常平均 |Δ%|</div>
                    <div class="detail-value warning">${avgAbsDelta}%</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">当前点异常</div>
                    <div class="detail-value ${currentAnomalyClass}">${currentAnomalyStatus}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">目标值</div>
                    <div class="detail-value info">${threshold}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Baseline 值</div>
                    <div class="detail-value">${baseline}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">连续变差点数</div>
                    <div class="detail-value ${streakLen > 0 ? 'critical' : 'success'}">${streakLen}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">最新日期</div>
                    <div class="detail-value">${latestRecord.date || 'N/A'}</div>
                    ${anomalyTagsHtml}
                </div>
            `;
        }

        function isAnomaly(record, anomalyType) {
            switch (anomalyType) {
                case 'critical':
                    return record.if_error === 1 && record.status_anomaly_flag === 1;
                case 'status':
                    return record.status_anomaly_flag === 1;
                case 'sudden':
                    return record.sudden_flag === 1;
                case 'trend':
                    return (record.bad_ratio || 0) >= 0.3 && record.overall_trend_negative === 1;
                default:
                    return false;
            }
        }

        function findStreakRanges(data) {
            // 找出所有 streak_len > 0 的连续区间
            // 区间从异常前一天开始
            const ranges = [];
            let start = null;

            for (let i = 0; i < data.length; i++) {
                const streakLen = data[i].streak_len || 0;

                if (streakLen > 0) {
                    if (start === null) {
                        // 从前一天开始（如果存在）
                        start = Math.max(0, i - 1);
                    }
                } else {
                    if (start !== null) {
                        ranges.push({ start, end: i - 1 });
                        start = null;
                    }
                }
            }

            // 处理最后一个区间
            if (start !== null) {
                ranges.push({ start, end: data.length - 1 });
            }

            return ranges;
        }

        function renderChart(chartId, data, anomalyType) {
            const ctx = document.getElementById(chartId);
            if (!ctx) return;

            if (chartInstances[chartId]) {
                chartInstances[chartId].destroy();
            }

            const labels = data.map(d => d.date);
            const values = data.map(d => d.value);
            const baseline = data.map(d => d.baseline_value);
            const threshold = data.length > 0 ? data[data.length - 1]?.threshold : null;

            // 所有异常点都用红色标注
            const anomalyPoints = data.map(d => isAnomaly(d, anomalyType) ? d.value : null);

            const datasets = [
                {
                    label: '实际值',
                    data: values,
                    borderColor: '#3742fa',
                    backgroundColor: 'rgba(55, 66, 250, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 6
                },
                {
                    label: '基线',
                    data: baseline,
                    borderColor: '#8b95ab',
                    borderWidth: 1,
                    borderDash: [5, 5],
                    fill: false,
                    tension: 0.4,
                    pointRadius: 0
                }
            ];

            if (threshold != null) {
                datasets.push({
                    label: '阈值',
                    data: Array(labels.length).fill(threshold),
                    borderColor: '#ffa502',
                    borderWidth: 1,
                    borderDash: [3, 3],
                    fill: false,
                    pointRadius: 0
                });
            }

            // 连续变差区间阴影（从前一天开始）
            const streakRanges = findStreakRanges(data);
            streakRanges.forEach((range, idx) => {
                const streakData = Array(labels.length).fill(null);
                for (let i = range.start; i <= range.end; i++) {
                    streakData[i] = values[i];
                }

                datasets.push({
                    label: idx === 0 ? '连续变差区域' : '',
                    data: streakData,
                    backgroundColor: 'rgba(255, 71, 87, 0.15)',
                    borderColor: 'rgba(255, 71, 87, 0.3)',
                    borderWidth: 1,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    showLine: true
                });
            });

            // 所有异常点统一用红色
            datasets.push({
                label: '异常点',
                data: anomalyPoints,
                borderColor: '#ff4757',
                backgroundColor: '#ff4757',
                borderWidth: 2,
                pointRadius: 6,
                pointStyle: 'circle',
                showLine: false
            });

            chartInstances[chartId] = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    plugins: {
                        legend: { 
                            display: true,
                            position: 'top',
                            labels: {
                                color: '#8b95ab',
                                font: { size: 11 },
                                filter: function(legendItem, chartData) {
                                    return legendItem.text !== '';
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(26, 34, 55, 0.95)',
                            titleColor: '#e8edf4',
                            bodyColor: '#8b95ab',
                            borderColor: '#2a3551',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: true,
                            callbacks: {
                                afterBody: function(context) {
                                    const index = context[0].dataIndex;
                                    const record = data[index];
                                    if (!record) return '';

                                    const parts = [];

                                    // 显示与前一个点的变化率
                                    if (index > 0) {
                                        const prevValue = data[index - 1].value;
                                        if (prevValue != null && record.value != null) {
                                            const changeRate = ((record.value - prevValue) / prevValue * 100).toFixed(1);
                                            parts.push(`vs 前一天: ${changeRate}%`);
                                        }
                                    }

                                    if (record.streak_len && record.streak_len > 0) {
                                        parts.push(`连续变差: ${record.streak_len} 天`);
                                    }
                                    if (record.delta_pct != null) {
                                        parts.push(`vs Baseline: ${(record.delta_pct * 100).toFixed(1)}%`);
                                    }
                                    return parts.join('\n');
                                }
                            }
                        },
                        // 添加数据标签插件
                        datalabels: {
                            display: function(context) {
                                // 只在数据点显示
                                return context.dataIndex > 0;
                            },
                            align: 'top',
                            anchor: 'end',
                            formatter: function(value, context) {
                                if (context.datasetIndex !== 0) return ''; // 只在实际值线显示

                                const index = context.dataIndex;
                                if (index === 0) return '';

                                const currentValue = data[index].value;
                                const prevValue = data[index - 1].value;

                                if (currentValue == null || prevValue == null) return '';

                                const changeRate = ((currentValue - prevValue) / prevValue * 100).toFixed(1);
                                return changeRate + '%';
                            },
                            color: '#8b95ab',
                            font: {
                                size: 9,
                                family: 'JetBrains Mono'
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(42, 53, 81, 0.3)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#5a6684',
                                maxTicksLimit: 10
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(42, 53, 81, 0.3)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#5a6684'
                            }
                        }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initializeDashboard);
    
    </script>
</body>
</html>
